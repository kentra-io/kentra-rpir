name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # GNU and BSD sed both run the scripts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sh tests/run.sh
      - if: matrix.os == 'ubuntu-latest'
        run: shellcheck -s sh scripts/*.sh tests/*.sh
