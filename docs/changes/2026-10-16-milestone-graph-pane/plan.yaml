  - number: 5
    slug: pane-wiring
    goal: The hooks module tracks a live implement run and draws it in the pane and the band, with arrow-key selection, a hotkey and transcript opening
    description: |
      Wires the pure modules (M2 `hooks/plan.ts`, M3 `hooks/tracker.ts`, M4
      `hooks/layout.ts`) to the engine in `hooks/register.tsx`, replacing M1's
      placeholder drawing and keeping its command and toggle. Adds
      `hooks/nav.ts` for the selection logic and the wiring's other pure
      helpers. `register.tsx` stays wiring only: every decision that can be a
      pure function lives in `nav.ts`, `tracker.ts` or `layout.ts`.

      **State.** `$.state` under `'kentra-rpir'` (`run`, `selection`,
      `isPaneOpen`, per `types/index.d.ts` from M1), through
      `atom`/`read`/`update` from `'claude-code'`. Every tracker event goes
      through `reduce` inside `update($, runAtom, …)`; a state write redraws
      every reader by itself (no `$.ui.invalidate` needed for it). Only the
      1-second timer calls `$.ui.invalidate('ui.render')`, because elapsed
      times change while state does not.

      **Events → TrackerEvent** (types verified in the 2.1.301 types file):
      - `agent.spawn` (main session only: `e.parentAgentId === undefined`):
        if `parseDispatch(e.prompt)` is null, `return next(e)` untouched.
        Else take `at = await $.clock.now()`, `const r = await next(e)`; the
        agentId is `r.agentId` (spec P2, verified; absent on a deny). Reduce a
        `spawn` with `toolUseId: e.tool_use_id || null` (the field is a
        string, possibly empty). On the first milestone dispatch of the
        session create the run (`emptyRun(at)`). On every milestone dispatch
        reload the plan (`loadPlan($, await $.session.id())` → `plan` event,
        spec req 6) and make sure the timer runs. On the first one also open
        the pane unasked (`$.ui.open({ id: 'rpir-graph', title: 'kentra-rpir' })`:
        it docks from 144 columns and waits undrawn below that, spec req 19).
      - `tool.call` with `e.agentId` of a tracked agent: reduce a `tool` event
        with `toolSummary(e.tool, e)` (`nav.ts`) before `next(e)`.
      - `tool.call` in the main session (no agentId):
        - tool `Agent`: `const r = await next(e)`; unless the input has
          `run_in_background: true` (its result is only a launch notice),
          reduce `agentDone` with `agentId: null`, `toolUseId: e.tool_use_id`,
          `resultText: r.text` (ToolCallResult.text, "the result as the model
          reads it");
        - tool `Bash`: `const r = await next(e)`; reduce `bash` with
          `e.command` and `isError: r.deny !== undefined || r.isError === true`;
        - always return `r` unchanged; tracking runs in a try/catch so it can
          never break a tool call.
      - `turn.complete` with `e.agentId` of a tracked agent: reduce
        `agentDone` with that agentId, `toolUseId: null` and
        `resultText: e.answer || null` (TurnCompleteFields.answer is the
        report the subagent handed back). This is the end signal for
        background agents too.
      - `session.start`: register the command (as M1) and, after a hot reload
        with an agent still running, restart the timer (module variables,
        the timer handle among them, start over on reload; `$.state` stays).

      **Timer.** `$.clock.every(1000, fn)` exists (`TimerCall`, returns
      `{ cancel }`; spec P12 settled by the types). One module-level handle:
      started by every milestone dispatch when not running; each tick reads
      the run, cancels itself when no agent has `endedAt === null`, and else
      calls `$.ui.invalidate('ui.render')`. The tick that finds nothing
      running does not invalidate.

      **Pane drawing** (`ui.render` on `{ component: 'Pane', requestId: 'rpir-graph' }`):
      no run → M1's placeholder text `No implement run in this session yet.`
      Else a column: `headerLine(...)` as dim `Text`; a `Text` (theme colour
      `warning`) `plan could not be found: <planError>` when planError is
      set; then for each `Row` of `layoutGraph(milestones, views, width)` a
      one-row `Box` keyed `row.key` holding a dim `Text` gutter (omitted when
      the gutter is empty) and the body. A header row is a `Button` with
      `key={'m-' + slug}`, `plain`, holding one `Text` with the body (spec
      P13: a Button holds only strings and Text, so the header row is the
      Button); other rows are `Text`. Width: `Math.max(40, e.props.bodyColumns)`
      (`Pane.bodyColumns` is the body's cells inside the frame — more exact
      than `e.viewport`, which is the whole surface). Colour by status, on
      the body `Text`: merged `success`, stuck `error`, implementing /
      verifying / fixing `claude` (the accent), waiting `dimColor`, the rest
      default. `milestonesOf(run)` (`nav.ts`) gives the plan's milestones, or,
      when the plan is null, the tracked milestones as plan milestones with
      goal `''` and no dependencies.

      **Selection and keys** (spec req 16, P14 verified by spike; the spike
      folder is gitignored and not in this worktree, so the facts are here):
      - graph taller than the pane: every Up/Down arrives as `ui.scroll` on
        the pane with origin person, `|by| == 1` and no pointer. The wheel
        has a pointer; PageUp/PageDown have `|by| == bodyRows`, Home/End
        `contentRows`. A hook returning `{}` stops the engine's scroll.
        `$.ui.focus({ requestId: 'rpir-graph', key })` moves the ring and
        `$.ui.scroll({ to: { key }, in: 'rpir-graph' })` brings the key into
        view. The mod's own scroll does not re-enter its `ui.scroll` hook;
        its own focus move re-enters `ui.focus` with origin plugin.
      - The hook writes the new selection first, then fires focus and scroll
        **without awaiting** them (`void $.ui.focus(...).then(() =>
        $.ui.scroll(...)).catch(() => undefined)`), then returns `{}`. Reason:
        the test kit (`claude-code/testing`) has no implementation behind `$.ui.focus`; an
        awaited call there rejects and the engine skips the whole hook (spike
        E1). Live, both forms worked.
      - graph that fits: arrows arrive only as `ui.focus` (same as Tab); the
        hook lets `next(e)` move the ring (the engine wraps), and when the
        result has no deny, origin is person and `e.element` starts `m-`,
        records that slug as `selection`.
      - `hooks/nav.ts` exports
        `isArrowScroll(e: { origin?: string; by: number; pointer?: unknown }): boolean`
        (origin `'person'`, |by| == 1, no pointer; the wiring passes
        `origin: e.origin.kind`) and
        `nextSelection(slugs: string[], current: string | null, dir: 1 | -1): string | null`
        (clamps at both ends; null or unknown current → first for 1, last for
        -1; empty slugs → null), plus `milestonesOf`, `headerSlugs` (header
        order = `orderForDrawing(milestonesOf(run))`), `viewsOf` and
        `toolSummary`.
      - Enter on a header Button runs its `onPress`: open the transcript of
        that milestone's `runningAgentId ?? lastAgentId` with
        `$.ui.view({ agentId })`; with no agent, `$.ui.toast('M<n> has not been dispatched yet')`.

      **Opening and closing.** togglePane keeps M1's rule: it decides from
      $.ui.panes(), since isPaneOpen goes stale after a reload; isPaneOpen is
      a cache. The command and the band button both call `togglePane`: it
      closes the pane when `$.ui.panes()` lists `rpir-graph` with
      `isPlaced: true`, else it opens it, and then copies the outcome into
      `isPaneOpen` (true only when `$.ui.open` resolved `{ isPlaced: true }`).
      A pane that waits undrawn (listed with `isPlaced: false`) counts as
      not open, so on a narrow terminal the unasked open leaves `isPaneOpen`
      false and `/rpir-graph` opens (asked, and so placed) it rather than
      closing it (spec req 19). The mod never draws the graph inline itself
      while the pane waits. The unasked open (first dispatch) is skipped
      when `$.ui.panes()` already lists the pane. A `ui.close` hook on
      `{ id: 'rpir-graph' }` sets `isPaneOpen` false whoever closes the pane.
      Closing never touches `run` (spec req 21).

      **Band** (`ui.render` on `{ component: 'AbovePrompt' }`): no run, or
      `e.props.hasSurvey` → `next(e)`. Else one row: `bandLine(...)` as dim
      `Text` cut to `bodyColumns − 10`, plus a `Button` with
      `key="rpir-toggle"`, label `graph`, `action` = the borrowed engine
      keybinding action, `onPress` toggling the pane.
      **Borrowed action** (spec P7, unverified): the constant
      `TOGGLE_ACTION` in `register.tsx`, first `app:toggleDiffPreSession`
      (Global, no default chord, its engine handler is mounted only while
      the diff panel is open). Both it and `app:toggleReplTab` appear as
      action names in the 2.1.301 binary. If `claude plugin validate .`
      refuses the action, try `app:toggleReplTab`, then set
      `TOGGLE_ACTION = undefined` (the Button then has no `action`, spec
      req 20's fallback). Report which action shipped; M6 reads the constant.

      **Test seam.** `register.tsx` also exports the `tool.call` hook as
      `handleToolCall` (typed `Hook<'tool.call'>`). The tests drive every
