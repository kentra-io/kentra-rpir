# yaml-language-server: $schema=https://raw.githubusercontent.com/kentra-io/milestoned-plan-dag/v0.3.0/schema/plan.schema.json
schemaVersion: 0.3.0
description: |
  Adds a Claude Code **mod** to the kentra-rpir plugin: a live side pane that
  draws the plan of a running `/kentra-rpir:implement` as a graph of milestone
  boxes, with status, per-role timings and the current tool call of each
  milestone's subagent.

  **What a mod is.** A Claude Code plugin whose `hooks/hooks.json` names a
  hooks module (`{ "modules": ["./register.tsx"] }`). The module exports
  `register: Register = (on, options) => { ... }` (types imported from
  `'claude-code'`). Every hook is `($, e, next)`: `$` is the engine interface,
  `e` the frozen event input, `next(e)` runs the engine's own behaviour and
  resolves to the event's result. The module runs with **no Node and no DOM**:
  no `require`, no `fs`, no dynamic `import()`; a file of the plugin is
  imported with a static `import`, and each such file is named `.ts`, `.tsx`
  or `.js`. JSX compiles against the global `h`; elements come from
  `const { Box, Text, Button } = $.ui.resolve(e)`. `Date.now()` is fine in pure
  code, but hooks take time from `await $.clock.now()` so tests can mock it.

  **API reference.** Load the `plugin-authoring` skill: it names the types file
  for the installed Claude Code build (`.../plugin-authoring/types/claude-code.d.ts`,
  ~14k lines) and `reference.md` and `examples/` beside it. Grep the types file
  for the name at hand (`'agent.spawn'`, `'tool.call'`, `'ui.scroll'`,
  `UiScrollInput`, `Pane: {`, `ButtonProps`) and read the declaration it lands
  on. Do not guess API shapes.

  **Layout of the mod in this repo.** The plugin root is the repo root
  (`.claude-plugin/plugin.json`). The mod's files:
  - `hooks/hooks.json` — names `./register.tsx`;
  - `hooks/register.tsx` — the hooks module: wiring only (events → tracker,
    state → layout → tree);
  - `hooks/plan.ts`, `hooks/tracker.ts`, `hooks/layout.ts`, `hooks/nav.ts` —
    pure modules (no `$` except `loadPlan`), unit-tested;
  - `hooks/vendor/` — a vendored YAML parser;
  - `hooks/test/*.test.ts(x)` — tests run by `claude plugin test` (staged copy), which
    import `test`, `expect`, `mock` from `'claude-code/testing'`;
  - `types/index.d.ts` — the shared types and the `$.state` contract, named
    in `plugin.json` as `"types": "./types/index.d.ts"`.

  **What the mod reads.** The implement skill
  (`skills/implement/SKILL.md`) dispatches each milestone from the main
  session with the Agent tool. Its prompts start with a fixed first line:
  `You are implementing milestone M<n> \`<slug>\` of the change "<title>".`
  (`skills/implement/implementer-prompt.md`) and
  `You are verifying milestone M<n> \`<slug>\` of the change "<title>".`
  (`skills/implement/verifier-prompt.md`). The implementer's report contains
  a line `STATUS: DONE|DONE_WITH_CONCERNS|NEEDS_CONTEXT|BLOCKED`; the
  verifier's a line `VERDICT: PASS|FAIL`. The orchestrator merges with
  `git -C <worktree> merge --no-ff <branch> -m "Merge M<n> <mslug>"`, and
  registers itself with a line `<session id> <change folder> implement` in
  `.kentra-rpir/sessions.map` at the project root. The plan is
  `<change folder>/plan.yaml`; the change's title is `spec.md`'s frontmatter
  `title:`. Do not edit the implement skill or its prompts.

  **Standard check.** `sh tests/run.sh` from the repo root. Since M1 it also
  runs, when `claude` is on PATH, `claude plugin validate .` and
  `claude plugin test` on a staged temp copy of `.claude-plugin/plugin.json`,
  `hooks/` and `types/` (a test run at the repo root would also pick up the
  gitignored spike plugins under `docs/changes/*/research/spikes/`, PL1).
  So mod tests live under `hooks/test/` and import only from `hooks/` and
  `types/`. Every milestone keeps it green.

  **Versioning.** Every change to the plugin bumps `version` in
  `.claude-plugin/plugin.json`; M1 sets `0.5.0` and later milestones leave it.
rules:
  - plugin-authoring
milestones:
  - number: 1
    slug: mod-scaffold
    goal: The plugin ships a loadable mod with the shared types and a /rpir-graph command
    description: |
      The root every other milestone builds on. It makes kentra-rpir a mod,
      fixes the shared types every pure module and the wiring use, and wires
      `claude plugin validate` and `claude plugin test` into the standard
      check. Nothing here tracks a run: M2 (plan source), M3 (tracker) and M4
      (layout) build pure modules against `types/index.d.ts`, and M5 replaces
      the placeholder drawing in `hooks/register.tsx` and adds every other
      hook. Keep the module small.

      **The hooks module.** `hooks/register.tsx`:
      - on `session.start` registers the command `rpir-graph` (description
        "Toggle the kentra-rpir milestone graph pane") and returns `next(e)`;
      - a `command.run` hook matched on `{ command: 'rpir-graph' }` toggles a
        pane with id `rpir-graph` and title `kentra-rpir`, answering for its
        own command (no `next`), with `{ text }` saying what it did;
      - a `ui.close` hook runs `next(e)` and then, when `e.id` is
        `rpir-graph`, writes `isPaneOpen` false: this covers the person's close
        mark (`e.origin.kind === 'person'`) as well as the mod's own close;
      - a `ui.render` hook on `{ component: 'Pane', requestId: 'rpir-graph' }`
        draws `<Text dimColor>No implement run in this session yet.</Text>` in
        a column `Box`.

      **Toggle decision.** The command decides open-or-close from
      `$.ui.panes()` (the engine's own record of this plugin's open panes,
      which survives a module reload), not from `isPaneOpen`, and then mirrors
      the result into `$.state` `isPaneOpen` through an `atom`. `isPaneOpen` is
      the value M5 and the band read; the engine's record is what cannot go
      stale (a pane dropped on `unload` raises no hook of its opener's).
      Use the literal `'rpir-graph'` in both `$.command.register` and the
      `command.run` matcher: with a literal, `claude plugin validate` reports
      the hook as `answers its own command:` instead of a gating hook.

      **Shared types.** `types/index.d.ts` declares the types below
      **exactly** (later milestones build against these names) plus the
      `$.state` contract. It is self-contained: no `import`, no reference.
      The hooks module imports value types from `'../types'` with
      `import type` (erased at run time).

      ```ts
      export type Role = 'impl' | 'verify'
      export type Status =
        | 'waiting' | 'ready' | 'implementing' | 'verifying'
        | 'fixing' | 'passed' | 'merged' | 'stuck'
      export type Outcome =
        | 'PASS' | 'FAIL' | 'DONE' | 'DONE_WITH_CONCERNS' | 'NEEDS_CONTEXT' | 'BLOCKED'

      /** One milestone of the plan; dependsOn holds slugs. */
      export type PlanMilestone = { number: number; slug: string; goal: string; dependsOn: string[] }
      /** The run's plan, as read from <changeFolder>/plan.yaml. */
      export type PlanGraph = { title: string; changeFolder: string; milestones: PlanMilestone[] }

      /** One implementer or verifier subagent. Times are ms since epoch. */
      export type AgentRun = {
        agentId: string
        toolUseId: string | null
        number: number
        slug: string
        role: Role
        startedAt: number
        endedAt: number | null
        lastTool: string | null   // one-line summary, e.g. "Bash: ./gradlew test"
        outcome: Outcome | null
      }
      /** What the mod has seen of one milestone. agents: agentIds in dispatch order. */
      export type MilestoneRun = {
        number: number
        slug: string
        agents: string[]
        firstDispatchAt: number
        mergedAt: number | null
      }
      /** Everything tracked about the session's implement run. */
      export type RunState = {
        startedAt: number
        plan: PlanGraph | null
        planError: string | null          // why the plan could not be read, shown in the pane
        milestones: Record<string, MilestoneRun>   // by slug
        agents: Record<string, AgentRun>           // by agentId
      }

      /** Inputs the tracker reduces; the wiring builds them from engine events. */
      export type TrackerEvent =
        | { kind: 'spawn'; agentId: string; toolUseId: string | null; prompt: string; at: number }
        | { kind: 'tool'; agentId: string; summary: string; at: number }
        | { kind: 'agentDone'; agentId: string | null; toolUseId: string | null; resultText: string | null; at: number }
        | { kind: 'bash'; command: string; isError: boolean; at: number }
        | { kind: 'plan'; plan: PlanGraph | null; error: string | null }

      /** Per-milestone numbers the layout draws. */
      export type MilestoneView = {
        status: Status
        implMs: number
        verifyMs: number
        attempts: number        // implementer dispatches
        verifyRounds: number    // verifier dispatches
        wallMs: number | null   // first dispatch → merge; null until merged
        currentTool: string | null
        runningAgentId: string | null
        lastAgentId: string | null
      }

      /** One row of the drawn graph: gutter (lane characters) + body. */
      export type Row = {
        key: string
        gutter: string
        body: string
        slug: string | null       // the box this row belongs to, if any
        isHeader: boolean         // the box's header line, drawn as a Button
        status: Status | null
      }

      declare module 'claude-code' {
        interface PluginState {
          'kentra-rpir': {
            run: RunState | null
            selection: string | null
            isPaneOpen: boolean
          }
        }
      }
      ```

      **The standard check runs the mod's tests on a staged copy (PL1).**
      `claude plugin test <dir>` runs every `*.test.ts(x)` under `<dir>`; it
      ignores `.gitignore` and has no option to narrow it (probed on Claude
      Code 2.1.301). The main checkout holds gitignored spike plugins under
      `docs/changes/*/research/spikes/` whose tests fail on purpose (their
      `REPORT` tests), so `claude plugin test .` at the repo root fails there.
      `tests/run.sh` therefore copies `.claude-plugin/plugin.json`, `hooks/`
      and `types/` into a fresh temp folder and runs `claude plugin test` on
      that folder. `claude plugin validate .` still runs at the repo root (it
      reads the manifest and the hooks module, not test files). Consequence
      for later milestones: a mod test may import only from `hooks/` and
      `types/` (the copy holds nothing else); M2's vendored parser in
      `hooks/vendor/` is covered.

      **Writing tests against the kit.** A test's `on` hooks sit beneath the
      plugin and stand for the engine; nothing else answers below them, so a
      test answers every engine call the plugin makes in that test. Probed on
      2.1.301:
      - a call on `$` that is an op (`$.command.register`, `$.ui.open`,
        `$.ui.close`, `$.ui.panes`) is answered by a test hook returning
        `{ value: <result> }`; a bare result is refused ("returned neither
        { value } nor { deny }") and the plugin's hook is skipped;
      - an event hook (`session.start`) returns its result directly
        (`{ cwd: e.cwd }`);
      - `$.state` needs no test hook (the kit keeps it); a test watches writes
        with `on('state.set', (_$, e, next) => { ...; return next(e) })`;
      - a test's `$.command.run` takes the whole `CommandRunInput`:
        `command`, `args`, `origin` and `presentation`;
      - `$.ui.mount` needs the `Pane` props in full: `title`, `isFocused`,
        `bodyColumns`, `placement`, `scroll: { offset, bodyRows }`, `view`.

      **tsconfig.** The repo-root `tsconfig.json` is the recipe from the
      types file's header comment, written out (no `extends`): neither
      `claude plugin validate` nor `claude plugin test` lays
      `.claude-plugin/types/`, so an `extends` of
      `.claude-plugin/types/tsconfig.json` would break `tsc` on a fresh
      checkout. Its `include` names `.claude-plugin/types`, `hooks` and
      `types` (not `tests`: the repo's `tests/` holds shell and `.mjs`
      scripts). `.claude-plugin/types/` is written by the engine when it
      loads the plugin from a folder the person owns (for example
      `claude --plugin-dir .`), or by hand by copying the `plugin-authoring`
      skill's `types/claude-code.d.ts` to
      `.claude-plugin/types/claude-code/index.d.ts`; it is gitignored.
      Type-checking is a manual extra, not part of `tests/run.sh`
      (TypeScript is not a repo dependency).

      **Version.** `plugin.json` goes from `0.4.1` to `0.5.0`; later
      milestones leave it.
    deliverables: |
      - `.claude-plugin/plugin.json` — modify: `version` → `0.5.0`, add `"types": "./types/index.d.ts"`.
      - `hooks/hooks.json` — create: `{ "modules": ["./register.tsx"] }`.
      - `hooks/register.tsx` — create: minimal hooks module (command `rpir-graph`, toggled placeholder pane, `ui.close` bookkeeping).
      - `types/index.d.ts` — create: the shared types and `PluginState` contract above, verbatim.
      - `tsconfig.json` — create: the header-comment recipe, for a manual `tsc -p .`.
      - `.gitignore` — modify: add `.claude-plugin/types/`.
      - `tests/run.sh` — modify: when `claude` is on PATH, validate the plugin and run the mod's tests on a staged copy; else print the skip line.
      - `hooks/test/scaffold.test.tsx` — create: the criteria's three kit tests.
    contract:
      check: sh tests/run.sh
      criteria:
        - name: "claude plugin validate ."
          given: the plugin with its new hooks module and `types/index.d.ts`
          when: "`claude plugin validate .` runs at the repo root"
          then: it reports the module hooks `session.start`, `command.run` and `ui.render` (the `ui.close` hook too), and exits 0 with nothing refused (warnings such as the root `CLAUDE.md` notice are allowed)
        - name: "plugin.json version and types"
          given: the plugin manifest after this milestone
          when: "`jq -r '.version, .types' .claude-plugin/plugin.json` runs"
          then: it prints `0.5.0` and `./types/index.d.ts`
        - name: "tsconfig.json type-checks the mod"
          given: the repo's `tsconfig.json`
          when: "`claude plugin validate .` runs (and, manually, `npx -p typescript@5.6.3 tsc -p .` with the API types laid)"
          then: "validate exits 0 and `tsconfig.json` exists at the repo root with `include` naming `.claude-plugin/types`, `hooks` and `types`; the manual `tsc -p .` prints nothing and exits 0"
        - name: hooks/test/scaffold.test.tsx::registers the rpir-graph command
          given: the plugin loaded by the test kit, with a test hook beneath it answering `command.register` and recording each registered name
          when: "a session starts (`$.session.start({ cwd, surface: 'terminal', isInteractive: true })`)"
          then: a command named `rpir-graph` is registered
        - name: hooks/test/scaffold.test.tsx::rpir-graph toggles the pane
          given: the plugin loaded by the test kit, pane closed, with test hooks beneath it answering `ui.open`, `ui.close` and `ui.panes` from one set of open pane ids and recording `isPaneOpen` writes
          when: "`rpir-graph` runs twice"
          then: the first run opens the pane `rpir-graph` (isPaneOpen true) and the second closes it (isPaneOpen false)
        - name: hooks/test/scaffold.test.tsx::placeholder pane text
          given: the pane mounted on the terminal and desktop surfaces
          when: it is drawn with no run tracked
          then: it shows the text `No implement run in this session yet.`
        - name: "tests/run.sh skips mod checks without claude"
          given: a PATH without `claude` (every directory holding `claude` removed from PATH, node, jq and git still on it)
          when: "`sh tests/run.sh` runs"
          then: "the existing script tests pass and it prints `skipping mod checks: claude not on PATH`"
      paths:
        - .claude-plugin/plugin.json
        - hooks/hooks.json
        - hooks/register.tsx
        - hooks/test/scaffold.test.tsx
        - types/**
        - tsconfig.json
        - .gitignore
        - tests/run.sh
    steps:
      - text: |
          [ ] Bump the manifest. In `.claude-plugin/plugin.json` change
          `"version": "0.4.1"` to `"version": "0.5.0"` and add, after the
          `"keywords"` line (keep every other field as it is):

          ```json
            "types": "./types/index.d.ts"
          ```

          (add the comma after the `keywords` array). Run
          `jq -r '.version, .types' .claude-plugin/plugin.json`; expected
          output: `0.5.0` then `./types/index.d.ts`.
        files: [.claude-plugin/plugin.json]
      - text: |
          [ ] Create the `types/` directory and write `types/index.d.ts` with
          exactly the TypeScript block in this milestone's description (from
          `export type Role` through the closing `}` of
          `declare module 'claude-code'`), nothing added, nothing imported.
          Run `mkdir -p types` first.
        files: [types/index.d.ts]
      - text: |
          [ ] Create `hooks/` and `hooks/test/` (`mkdir -p hooks/test`) and
          write `hooks/hooks.json`:

          ```json
          { "modules": ["./register.tsx"] }
          ```
        files: [hooks/hooks.json]
      - text: |
          [ ] Write `hooks/register.tsx`:

          ```tsx
          // kentra-rpir's mod: the milestone graph pane of an implement run.
          // M1 scaffold: the /rpir-graph command toggles a placeholder pane.
          import { atom, update } from 'claude-code'
          import type { Register } from 'claude-code'

          const PANE = 'rpir-graph'
          const TITLE = 'kentra-rpir'
          const isPaneOpen = atom({ plugin: 'kentra-rpir', key: 'isPaneOpen' } as const, false)

          export const register: Register = on => {
            on('session.start', async ($, e, next) => {
              await $.command.register({
                name: 'rpir-graph',
                description: 'Toggle the kentra-rpir milestone graph pane',
              })
              return next(e)
            })

            on('command.run', { command: 'rpir-graph' }, async $ => {
              const isUp = (await $.ui.panes()).some(pane => pane.id === PANE)
              if (isUp) {
                await $.ui.close({ id: PANE })
                await update($, isPaneOpen, () => false)
                return { text: 'Milestone graph pane closed.' }
              }
              await $.ui.open({ id: PANE, title: TITLE })
              await update($, isPaneOpen, () => true)
              return { text: 'Milestone graph pane opened.' }
            })

            on('ui.close', async ($, e, next) => {
              const closed = await next(e)
              if (e.id === PANE) await update($, isPaneOpen, () => false)
              return closed
            })

            on('ui.render', { component: 'Pane', requestId: PANE }, async ($, e) => {
              const { Box, Text } = $.ui.resolve(e)
              return (
                <Box flexDirection="column">
                  <Text dimColor>No implement run in this session yet.</Text>
                </Box>
              )
            })
          }
          ```
        files: [hooks/register.tsx]
      - text: |
          [ ] Validate. Run `claude plugin validate .` from the repo root.
          Expected (2.1.301; wording may vary by build): exit 0,
          `✔ Validation passed with warnings` (the root `CLAUDE.md` warning is
          pre-existing), and under `./register.tsx` the lines
          `hooks: session.start, command.run{command=rpir-graph}, ui.close, ui.render{component=Pane, requestId=rpir-graph}`,
          `answers its own command: command.run{command=rpir-graph}`,
          `state writes: kentra-rpir.isPaneOpen`, and under
          `types ./types/index.d.ts` the line
          `declares state: kentra-rpir.run, kentra-rpir.selection, kentra-rpir.isPaneOpen`.
          A `gating hook without .catch: ui.close` line is a fact, not a
          failure. Anything reported as refused or an error: fix it before
          going on.
      - text: |
          [ ] Write `hooks/test/scaffold.test.tsx`:

          ```tsx
          import { test, expect } from 'claude-code/testing'

          const PLUGIN = 'kentra-rpir'
          const PANE_PROPS = {
            title: 'kentra-rpir',
            isFocused: false,
            bodyColumns: 40,
            placement: 'dock',
            scroll: { offset: 0, bodyRows: 20 },
            view: {},
          } as const
          const RUN_GRAPH = {
            command: 'rpir-graph',
            args: '',
            origin: { kind: 'composer' },
            presentation: { isFullscreen: true, columns: 160 },
          } as const

          test('registers the rpir-graph command', async ($, on) => {
            const registered: string[] = []
            // Ops on $ are answered beneath the plugin with { value }.
            on('command.register', async (_$, e) => {
              registered.push(e.name)
              return { value: { command: e.name } }
            })
            on('session.start', async (_$, e) => ({ cwd: e.cwd }))
            await $.session.start({ cwd: '/repo', surface: 'terminal', isInteractive: true })
            expect(registered).toContain('rpir-graph')
          })

          test('rpir-graph toggles the pane', async ($, on) => {
            const open = new Set<string>()
            const writes: unknown[] = []
            on('ui.panes', async () => ({
              value: [...open].map(id => ({ id, title: 'kentra-rpir', isShown: true, isFocused: false, isPlaced: true })),
            }))
            on('ui.open', async (_$, e) => {
              open.add(e.id)
              return { value: { isPlaced: true } }
            })
            on('ui.close', async (_$, e) => {
              open.delete(e.id)
              return { value: undefined }
            })
            on('state.set', async (_$, e, next) => {
              if (e.plugin === PLUGIN && e.key === 'isPaneOpen') writes.push(e.value)
              return next(e)
            })

            await $.command.run(RUN_GRAPH)
            expect([...open]).toEqual(['rpir-graph'])
            expect(writes.at(-1)).toBe(true)

            await $.command.run(RUN_GRAPH)
            expect([...open]).toEqual([])
            expect(writes.at(-1)).toBe(false)
          })

          test('placeholder pane text', async $ => {
            for (const surface of ['terminal', 'desktop'] as const) {
              const ui = await $.ui.mount({ plugin: PLUGIN, surface, component: 'Pane', props: PANE_PROPS, requestId: 'rpir-graph' })
              expect(await ui.find({ type: 'Text', text: 'No implement run in this session yet.' })).toBeDefined()
              await ui.unmount()
            }
          })
          ```

          If a kit call's shape differs on the installed build, grep the
          `plugin-authoring` types file (`declare module 'claude-code/testing'`,
          `CommandRunInput`, `UiPane`, `MountTarget`) and adjust the test,
          keeping its three names and what each asserts.
        files: [hooks/test/scaffold.test.tsx]
      - text: |
          [ ] Wire the mod checks into `tests/run.sh`. Append after the last
          existing line (`node tests/check-workflows.mjs`):

          ```sh
          # The mod: validate the plugin, then run its tests on a staged copy.
          # `claude plugin test <dir>` runs every *.test.ts(x) under <dir>,
          # gitignored spike plugins included, so the copy holds only the mod.
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
            mod=$(mktemp -d "${TMPDIR:-/tmp}/rpir-mod.XXXXXX")
            trap 'rm -rf "$mod"' EXIT
            mkdir -p "$mod/.claude-plugin"
            cp .claude-plugin/plugin.json "$mod/.claude-plugin/plugin.json"
            cp -R hooks types "$mod/"
            claude plugin test "$mod"
          else
            echo "skipping mod checks: claude not on PATH"
          fi
          ```

          The script already has `set -e` and `cd`s to the repo root, so a
          failing validate or test fails the check.
        files: [tests/run.sh]
