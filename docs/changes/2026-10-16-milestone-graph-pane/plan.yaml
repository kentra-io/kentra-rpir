          when: viewOf runs after each event
          then: "status reads implementing, verifying, stuck, fixing, verifying, passed, merged; attempts 2, verifyRounds 2; implMs 5000 (3000 + 2000), verifyMs 3000 (2000 + 1000), wallMs 12000 (13000 − 1000)"
