  - number: 4
    slug: graph-layout
    goal: A pure layout draws the plan as one column of boxes with dependency lanes in a left gutter
    description: |
      Turns milestones plus their `MilestoneView`s into `Row`s (types from
      `types/index.d.ts`, written by M1) the pane draws one per line. Pure and
      independent of the tracker: it takes views as input, so it runs in
      parallel with M3. M5 (`hooks/register.tsx`) calls `layoutGraph`,
      `headerLine` and `bandLine`, draws each `Row` as a one-row Box
      (`gutter` as Text, then `body`; a header row's body is the label of a
      Button keyed `m-<slug>`), and colours it by `row.status`. Nothing here
      touches `$`, the clock or the engine.

      `hooks/layout.ts` exports (the first seven are the skeleton's contract
      with M5 and must keep these signatures):

      ```ts
      import type { MilestoneView, PlanMilestone, Row, Status } from '../types'

      /** 0–59s → "42s", then "6m12s", then "1h03m". */
      export function formatDuration(ms: number): string

      /** Cuts to `width` cells, ending with "…" when cut. Every glyph the layout emits is one cell. */
      export function cut(text: string, width: number): string

      export const STATUS_MARK: Record<Status, string>
      // waiting '·', ready '○', implementing '●', verifying '◐', fixing '↻', passed '◑', merged '✓', stuck '✗'

      /** Milestones in drawing order: by depth (0 for a root, else 1 + max depth of its
       *  dependencies; unknown dependency slugs ignored), then by number. */
      export function orderForDrawing(milestones: PlanMilestone[]): PlanMilestone[]

      /** The graph, one Row per terminal line, every row's gutter+body exactly `width` cells
       *  (pad with spaces), width ≥ 40. */
      export function layoutGraph(milestones: PlanMilestone[], views: Record<string, MilestoneView>, width: number): Row[]

      /** Pane header: title, then e.g. "2 merged · 1 verifying · 1 implementing · 3 waiting", then elapsed. One line, cut to width. */
      export function headerLine(title: string, counts: Record<Status, number>, elapsedMs: number, width: number): string

      /** Band text, e.g. "rpir: 2 merged · M3 verifying · M4 implementing" — merged count, then each
       *  running milestone as "M<n> <status>"; cut to width. */
      export function bandLine(milestones: PlanMilestone[], views: Record<string, MilestoneView>, width: number): string
      ```

      plus, for this milestone's tests only (M5 does not use them):

      ```ts
      /** One lane of the gutter; column null when the pane was too narrow to draw it. */
      export type Lane = { slug: string; column: number | null; startRow: number; endRow: number; dependents: string[] }
      /** layoutGraph plus the lanes it drew or dropped. */
      export function layoutWithLanes(milestones, views, width): { rows: Row[]; lanes: Lane[] }
      ```

      **A box** (body width `w` = width − gutter width, inner text width
      `w − 4`) is these rows, in order, each with key `<slug>:<kind>`:
      1. `header` (`isHeader: true`): `┌ M<n> <slug> ─…─┐`, with ` +N edges`
         after the slug when the lanes dropped N of its incoming edges (the
         slug is cut first so the suffix always shows);
      2. `goal`: `│ <goal> │`;
      3. `status`: `│ <mark> <status>[ (attempt k)] │` — attempt when attempts > 1;
      4. `times`: `│ impl <dur> · verify <dur>[ · rounds r][ · wall <dur>] │` —
         only when dispatched (attempts + verifyRounds > 0); rounds when
         verifyRounds > 1; wall when wallMs is not null;
      5. `tool`: `│ ▸ <currentTool> │` — only while currentTool is set;
      6. `needs`: `│ needs M<a>, M<b> │` — only when it has dependencies (a slug
         not in the plan is shown as the slug);
      7. `bottom`: `└─…─┘`.
      Every row of the box carries `slug` and `status` (the view's). Every
      text is cut, never wrapped; `cut` also turns line breaks and tabs into
      one space so a multi-line goal stays one row (spec req 12b, 17). A
      milestone with no entry in `views` is drawn with a default view
      (waiting, zeros, nulls).

      **Lanes** (spec req 12, 12a), like `git log --graph`. Row positions are
      fixed before lanes are drawn, since a box's row count depends only on its
      view. One lane per milestone with dependents (dependents = later boxes
      whose `dependsOn` names it). A lane spans from its milestone's bottom row
      to its last dependent's header row, inclusive. Lanes are taken in
      drawing order; each gets the leftmost column whose earlier lanes do not
      overlap its span; only columns `0 .. floor((width − 30)/2) − 1` exist,
      and a lane with none free is dropped (`column: null`) — each of its
      dependents counts one dropped edge. Gutter width = 2 × (highest drawn
      column + 1), so at width 40 at most 10 cells and the boxes keep ≥ 30.

      Each gutter row is built cell by cell. A lane has a *horizontal* on a
      row where it starts (its bottom row) or where a dependent's header is;
      `minH` is the leftmost such lane column on the row. Lane cell of column
      `c` = glyph of (up: lane active and row > start, down: lane active and
      row < end, left: `minH < c`, right: `minH ≤ c`) from a 16-entry table
      (`│ ┌ └ ├ ┴ ┼ ─ …`), so crossings come out as `┼` and are not avoided.
      Spacer cell after it = `─` when `minH ≤ c`, else space; on a branch row
      the last gutter cell is `▶`. Result for the crossing DAG (M1 a, M2 b, M3 c on a, M4 d on a and b, M5 e on b; goals
      `Goal of <slug>`, no views) at width 40, printed by this milestone's code:

      ```
          ┌ M1 a ────────────────────────────┐
          │ Goal of a                        │
          │ · waiting                        │
      ┌───└──────────────────────────────────┘
      │   ┌ M2 b ────────────────────────────┐
      │   │ Goal of b                        │
      │   │ · waiting                        │
      │ ┌─└──────────────────────────────────┘
      ├─┼▶┌ M3 c ────────────────────────────┐
      │ │ │ Goal of c                        │
      │ │ │ · waiting                        │
      │ │ │ needs M1                         │
      │ │ └──────────────────────────────────┘
      └─┼▶┌ M4 d ────────────────────────────┐
        │ │ Goal of d                        │
        │ │ · waiting                        │
        │ │ needs M1, M2                     │
        │ └──────────────────────────────────┘
        └▶┌ M5 e ────────────────────────────┐
          │ Goal of e                        │
          │ · waiting                        │
          │ needs M2                         │
          └──────────────────────────────────┘
      ```

      Every glyph is counted as one cell (`Array.from(text).length`); that
      the terminal also draws them one cell wide is claim PL2 / spec P15
      (unverified) — the live run of M6 checks it by eye.

      **headerLine**: counts listed for statuses with a non-zero count in the
      order merged, passed, verifying, fixing, implementing, stuck, ready,
      waiting, joined with ` · `; line = `<title> — <counts> — <elapsed>`; the
      title is cut first (to at least 8 cells) so counts and elapsed survive,
      then the whole line is cut to width. **bandLine**: `rpir: <k> merged`,
      then ` · M<n> <status>` for each milestone whose status is
      implementing, verifying or fixing, in drawing order; cut to width.

      Widths below 40 are drawn as 40 (M5 passes at least 40).
