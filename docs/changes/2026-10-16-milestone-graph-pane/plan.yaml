  - number: 3
    slug: run-tracker
    goal: A pure tracker turns dispatch, tool, result and merge events into milestone statuses and timings
    description: |
      The model of a run, as pure functions over the types in
      `types/index.d.ts`. No `$`, no clock: every event carries `at` (ms), and
      the view functions take `now`. The wiring (M5) builds `TrackerEvent`s
      from engine events and stores the `RunState` in `$.state`.

      `hooks/tracker.ts` exports:

      ```ts
      import type { MilestoneView, Outcome, Role, RunState, Status, TrackerEvent } from '../types'

      /** First line `You are implementing|verifying milestone M<n> \`<slug>\`` → its parts; anything else → null.
       *  Leading whitespace is ignored; only the first non-empty line counts. */
      export function parseDispatch(prompt: string): { number: number; slug: string; role: Role } | null

      /** The last `VERDICT: PASS|FAIL` or `STATUS: DONE|DONE_WITH_CONCERNS|NEEDS_CONTEXT|BLOCKED`
       *  line in a subagent's final text (markdown bold/backticks around it tolerated), or null. */
      export function parseOutcome(text: string): Outcome | null

      /** A main-session Bash command containing `git ` … `merge` … `--no-ff` and `-m "Merge M<n> …"`
       *  (single or double quotes) → n; else null. */
      export function parseMerge(command: string): number | null

      export function emptyRun(at: number): RunState

      /** Applies one event. Pure: returns a new state, never mutates. */
      export function reduce(state: RunState, ev: TrackerEvent): RunState

      /** Status and numbers of one milestone (by slug) at `now`. */
      export function viewOf(state: RunState, slug: string, now: number): MilestoneView

      /** Count of plan milestones (or tracked ones when plan is null) per status. */
      export function countByStatus(state: RunState, now: number): Record<Status, number>
      ```

      **reduce:**
      - `spawn`: `parseDispatch(prompt)`; null → state unchanged. Otherwise add
        an `AgentRun` (endedAt null, lastTool null, outcome null) and append its
        agentId to the milestone's `agents`, creating the `MilestoneRun`
        (`firstDispatchAt = at`) on first sight. A spawn for a slug not in the
        plan is still tracked.
      - `tool`: set that agent's `lastTool = summary`; unknown agent → unchanged.
      - `agentDone`: find the agent by `agentId`, else by `toolUseId`; set
        `endedAt = at` (keep an earlier endedAt if already set), `lastTool = null`,
        and `outcome = parseOutcome(resultText)` when resultText is non-null
        (a later agentDone with text fills an outcome left null).
      - `bash`: `parseMerge(command)`; when it returns n, `isError` is false and a
        tracked milestone has number n, set its `mergedAt = at` (first time only).
      - `plan`: replace `plan` and `planError`.

      **Status (viewOf), in this order:**
      1. `merged` — mergedAt set.
      2. a running agent (endedAt null): verifier → `verifying`; implementer →
         `fixing` if any earlier verifier of this milestone has outcome FAIL,
         else `implementing`.
      3. the last agent (dispatch order) finished: verifier PASS → `passed`;
         verifier FAIL → `stuck`; implementer BLOCKED or NEEDS_CONTEXT →
         `stuck`; implementer with any other or no outcome → `implementing`
         (it waits for its verifier to be dispatched).
      4. never dispatched: `ready` when every `dependsOn` slug (from the plan)
         is merged, else `waiting`. A milestone not in the plan and never
         dispatched does not exist.

      **Numbers:** `implMs`/`verifyMs` = sum over that role's agents of
      `(endedAt ?? now) - startedAt`; `attempts`/`verifyRounds` = count of
      impl/verify agents; `wallMs = mergedAt - firstDispatchAt` once merged,
      else null; `currentTool` = the running agent's lastTool;
      `runningAgentId` = the newest agent with endedAt null; `lastAgentId` =
      the newest agent.

      **Decisions the skeleton leaves open, settled here:**
      - `parseDispatch` matches only the line's prefix up to the closing
        backtick of the slug; the ` of the change "<title>".` tail is not
        checked, so a title holding any characters still matches. The slug is
        whatever sits between the backticks (`[^`]+`).
      - `parseOutcome` pairs keywords and values: `VERDICT` takes only
        `PASS|FAIL`, `STATUS` only the four implementer values, so
        `VERDICT: DONE` is null. Leading `>`, `-`, `*`, `_` and backticks and
        the same marks around the colon are tolerated (`**VERDICT: FAIL**`,
        `**VERDICT:** FAIL`, `` `STATUS: BLOCKED` ``). The keyword must open
        the line (after those marks), so prose such as `the STATUS: DONE line`
        does not count. Last matching line wins.
      - `parseMerge` requires, in order, `git` + whitespace, the word `merge`,
        and the flag `--no-ff`, and anywhere a `-m` followed by a quote and
        `Merge M<n>` then a space or the closing quote. It does not check that
        the quotes close, and a chained command (`... && git worktree remove`)
        still matches.
      - `reduce` returns the **same object** (`===`) whenever the event changes
        nothing, so the wiring (M5) can skip a `$.state.set` with
        `next !== prev`. A second `spawn` for an agentId already tracked is a
        no-op.
      - `agentDone` arrives twice per subagent in the wiring: once from
        `turn.complete` (agentId, no text) and once from the Agent tool's
        result in the main session (toolUseId, the final text). Either may
        come first. The outcome is `parseOutcome(text) ?? previous outcome`, so
        a text with no status line never erases one already read.
      - Spans are clamped at 0 (`Math.max(0, …)`), so a `now` earlier than an
        agent's start never shows a negative time.
      - The status of a running implementer is `fixing` when any verifier of
        the milestone dispatched **before it** has outcome `FAIL`.
      - After an implementer finishes and before its verifier is dispatched
        the status reads `implementing` (rule 3), including after a fix: the
        spec has no word for "implemented, waiting for verify" and the box's
        times show the implementer is done.
      - A verifier that has finished but whose verdict is not read yet (its
        `turn.complete` came before the Agent result) reads `verifying`, not
        `implementing` or `stuck`, so no wrong status flashes in between.
      - `bash` merges the first tracked milestone whose `number` is n and
        whose `mergedAt` is null; a merge of a milestone never dispatched in
        this session is ignored (it is not tracked).
      - `viewOf` for a slug neither tracked nor in the plan returns the
        never-dispatched view with status `waiting` and every number 0/null;
        callers do not ask for such slugs, it just must not throw.
      - `countByStatus` returns all eight keys, zero-filled. With a plan it
        counts exactly the plan's milestones (a tracked slug missing from the
        plan is not counted); with no plan it counts the tracked milestones.
      - The module imports only types (`import type`), so it has no runtime
        imports at all and runs in the mod environment as plain functions.

      **The template pin.** The tracker depends on the first line of both
      prompt templates, which this change must not edit. Three places hold
      that line and change together: the regex in `hooks/tracker.ts`, the
      constants `IMPL_TEMPLATE_LINE`/`VERIFY_TEMPLATE_LINE` in
      `hooks/test/tracker.test.ts` (raw, with `{{number}}`, `{{slug}}`,
      `{{title}}`), and the same two lines hard-coded in
      `tests/check-templates.sh`. The script checks that each template's
      `head -n 1` equals its line, that the test file holds each line
      verbatim (`grep -F`), and then runs itself against a temp copy whose
      verifier template has a changed first line, expecting exit 1 and the
      template's name in the output — that self-test is what proves the
      failure half of the criterion. Called with a directory argument it
      checks only that directory's two templates (used by the self-test).
    deliverables: |
      - `hooks/tracker.ts` — create: the functions above.
      - `hooks/test/tracker.test.ts` — create: the criteria's tests, driving `reduce` with hand-built event sequences.
      - `tests/check-templates.sh` — create: POSIX sh; compares `head -n 1` of each prompt template to the expected line.
      - `tests/run.sh` — modify: add `sh tests/check-templates.sh` after the existing script tests.
    contract:
      check: sh tests/run.sh
      criteria:
        - name: hooks/test/tracker.test.ts::parseDispatch reads both prompt templates
