      - pane-wiring
    steps:
      - |
        [ ] Find the facts the section depends on. From the repo root:

        ```sh
        grep -n 'const TOGGLE_ACTION' hooks/register.tsx
        grep -n "rpir-graph" hooks/register.tsx
        ```

        Expected: `const TOGGLE_ACTION` is a string literal (the action name,
