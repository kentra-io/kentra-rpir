          when: parseOutcome and parseMerge run
          then: "parseOutcome gives `DONE` for `STATUS: DONE` plus COMMITS and CHECK lines, `DONE_WITH_CONCERNS` for `STATUS: DONE_WITH_CONCERNS`, `NEEDS_CONTEXT` for the backticked `` `STATUS: NEEDS_CONTEXT` ``, `BLOCKED` for `STATUS: BLOCKED`, `PASS` for `VERDICT: PASS`, `FAIL` for `**VERDICT: FAIL**` after a summary and for `**VERDICT:** FAIL`, `DONE` (the last status wins) for `STATUS: BLOCKED` then `STATUS: DONE`, and null for `VERDICT: DONE`, for `the STATUS: DONE line is missing` and for `no report here`; parseMerge gives 2 for the `--no-ff` merge of M2 with double quotes, 12 for single quotes (`'Merge M12 x'`), 3 for a merge of M3 chained with `&& git worktree remove`, and null for a `git merge` without `--no-ff`, for `--no-ff` with a message not of the form `Merge M<n> <slug>`, and for `echo \"Merge M2 x\" --no-ff`"
        - name: hooks/test/tracker.test.ts::parallel milestones time independently
