  - number: 6
    slug: docs
    goal: The README documents the pane, the command, the minimum Claude Code version and the hotkey binding
    description: |
      Users learn the pane exists from the README (spec requirement 3). This
      milestone adds one section, `## Watching an implement run`, and changes
      nothing else. It is the last milestone: it depends on M5 because the
      section names the engine keybinding action that M5 shipped on the
      band's `graph` Button, and M5 decides that action while building it.

      **Placement.** The README has no section of its own for
      `/kentra-rpir:implement`: the stage table and the bullet list at the
      top describe all four stages, followed by `## Install`, `## Configure`,
      `## History` and `## License`. Put the new section after
      `## Configure` and before `## History`; that is the first place after
      the text that describes the implement stage where a new `##` section
      fits.

      **Content** (the full text is in step 2), covering:
      - what the pane shows (one box per milestone, lanes for dependencies,
        status, impl/verify/wall times, attempts, current tool) and the band;
      - it opens by itself on the first milestone dispatch in a fullscreen
        terminal of 144+ columns; `/rpir-graph` toggles it (docks from 110);
      - Up/Down select a box, Enter opens its subagent's transcript, `ctrl+x x`
        closes the pane;
      - the optional hotkey: the band's `graph` button borrows the engine
        action that M5 shipped (read `hooks/register.tsx` for the `action`
        value; if it has none, say there is no hotkey yet) and the
        `~/.claude/keybindings.json` entry to bind it, e.g.
        `{ "context": "Global", "bindings": { "ctrl+x g": "<action>" } }`, with
        the note that the same chord also performs that action's own
        behaviour where the engine handles it;
      - needs Claude Code 2.1.287 or later; on older versions the rest of the
        plugin works without the pane (spec P9, unverified — say "should").
      - limits: tracks the current session only; a resumed or restarted
        session starts empty.

      **Design decisions settled here.**
      - The `keybindings.json` example is a whole file in the documented
        shape (`{ "bindings": [ { "context": ..., "bindings": { chord: action } } ] }`),
        with a sentence telling a user who already has the file to add the
        block to its `bindings` array instead of replacing the file.
      - The chord in the example is `ctrl+x g`. It is a suggestion, said as
        one; the user picks any free chord.
      - The `ctrl+x x` close chord is the engine's chord for closing a
        docked pane (premise PD1, PL13, verified: the keybindings action table lists
        `pane:close` = `ctrl+x x` in context `Pane`). Step 1 confirms it; if the
        types or reference name another chord, the section uses that one.
      - Do not bump `version` in `.claude-plugin/plugin.json`: M1 set
        `0.5.0` for the whole change (plan description, "Versioning").
    deliverables: |
      - `README.md` — modify: the new `## Watching an implement run` section
        between `## Configure` and `## History`. No other file changes.
    contract:
      check: sh tests/run.sh
      criteria:
        - name: "human: README section"
          given: the README after this milestone
          when: a reader looks for how to watch an implement run
          then: the section names the pane, `/rpir-graph`, auto-open widths, keys, the hotkey binding (or its absence), the 2.1.287 minimum and the session-only limit
      paths:
        - README.md
