  - number: 2
    slug: plan-source
    goal: The mod finds this session's change folder and reads its plan into a PlanGraph
    description: |
      Turns files on disk into the `PlanGraph` (from `types/index.d.ts`, written
      by M1) that the layout (M4) draws and the wiring (M5) stores in
      `RunState.plan`. Everything but `loadPlan` is a pure function over
      strings, so it is tested without a filesystem (the test kit runs with no
      fs, network or process).

      `hooks/plan.ts` exports exactly these four functions (M5 calls
      `loadPlan`; the signatures cross milestone boundaries, do not change them):

      ```ts
      import type { EngineInterface } from 'claude-code'
      import type { PlanGraph } from '../types'

      /** The change folder of this session's newest `implement` line in
       *  sessions.map (`<session id> <change folder> <stage>` per line), or null. */
      export function findChangeFolder(sessionsMap: string, sessionId: string): string | null

      /** spec.md frontmatter `title:` (unquoted), or the folder's basename when absent. */
      export function parseSpecTitle(specText: string, changeFolder: string): string

      /** Parses plan.yaml text (schemaVersion 0.3.0: milestones[] with number, slug, goal,
       *  depends-on) into a PlanGraph sorted by number. A milestone without slug gets the
       *  slug derived from goal (lowercase, non-alphanumerics → '-', trimmed). Throws an
       *  Error with a one-line message when the text is not YAML or has no milestones. */
      export function parsePlanYaml(text: string, title: string, changeFolder: string): PlanGraph

      /** Reads .kentra-rpir/sessions.map, <changeFolder>/spec.md and <changeFolder>/plan.yaml
       *  relative to the project root via $.fs, and returns the graph, or
       *  { plan: null, error } with a one-line reason (no sessions.map entry for this
       *  session, file missing, parse error). Never throws. */
      export async function loadPlan($: EngineInterface, sessionId: string): Promise<{ plan: PlanGraph | null; error: string | null }>
      ```

      **Decisions already made (do not revisit):**

      - **sessions.map parsing** matches `scripts/sessions.sh`: strip a
        trailing `\r`, split each line on runs of whitespace, fields are
        `id folder stage`; a line with fewer than two fields is ignored; the
        id match is literal. Only stage `implement` counts; the last matching
        line in the file wins (the file is append-only, so last = newest). A
        change folder holding spaces is not supported (sessions.sh does not
        support it either). The skill writes the folder relative to the
        project root (for example `docs/changes/2026-10-16-milestone-graph-pane`),
        but an absolute one is accepted.
      - **Project root.** `loadPlan` resolves every path against
        `await $.session.root()` (the session's project root, absolute; a
        shell `cd` does not move it), not against the working directory, so
        it works from the project root where the implement skill stays and
        keeps working if a hook's cwd differs. An absolute change folder is
        used as given. `$.fs.read(path)` rejects when the file is missing (or
        over 4 MiB); `loadPlan` turns every rejection into a one-line error.
      - **spec.md is optional.** If `<changeFolder>/spec.md` cannot be read,
        the title falls back to the folder's basename and loading continues.
        sessions.map or plan.yaml unreadable is an error.
      - **Slug derivation** equals `milestoned-plan-dag`'s `DeriveSlug`
        (`internal/plan/load.go`): lowercase, every run of characters outside
        `[a-z0-9]` becomes one `-`, leading/trailing `-` trimmed. So
        `Add the Thing!` → `add-the-thing`. `depends-on` entries are slugs
        (schema `$defs.slug`), copied as strings.
      - **Milestone validation.** A milestone whose `number` is not an
        integer, or whose `goal` is not a non-empty string, makes
        `parsePlanYaml` throw (`plan.yaml milestone <i> has no number` /
        `... has no goal`, `<i>` its 1-based position). Unknown keys
        (description, steps, contract, ...) are ignored.
      - **One-line errors.** js-yaml's `YAMLException.message` is multi-line
        (`bad indentation of a mapping entry (1:5)\n\n 1 | a: b: c\n...`);
        every message the module produces is cut to its first line and
        trimmed (`oneLine`). Messages: `plan.yaml is not valid YAML: <first
        line>`, `plan.yaml has no milestones`, `cannot read
        .kentra-rpir/sessions.map`, `no implement entry for this session in
        .kentra-rpir/sessions.map`, `cannot read <changeFolder>/plan.yaml`.
      - **Imports.** Plugin files are imported with static `import`
        declarations. TypeScript modules extensionless (`'../plan'`, the
        `moduleResolution: bundler` style the types file's tsconfig recipe
        uses); the vendored parser with its suffix (`'./vendor/js-yaml.mjs'`).
        `.mjs` is a loadable suffix (types file header: `.ts, .tsx, .jsx, .js,
        .mjs, .cjs, .mts, .cts`).

      **YAML parser.** Vendor `js-yaml` 4.1.0 (MIT) as a single ES module at
      `hooks/vendor/js-yaml.mjs` with its license header kept and
      `hooks/vendor/LICENSE-js-yaml` beside it; import it statically from
      `plan.ts` (`import { load } from './vendor/js-yaml.mjs'`). Take the
      ESM build `dist/js-yaml.mjs` from the npm tarball of exactly 4.1.0
      (`https://registry.npmjs.org/js-yaml/-/js-yaml-4.1.0.tgz`). That file
      is 107,533 bytes, carries its license banner `/*! js-yaml 4.1.0 https://github.com/nodeca/js-yaml @license MIT */` (after a leading blank line),
      ends with `export { CORE_SCHEMA, ..., load, loadAll, ... }`, imports
      nothing and uses no `require`, `eval`, `new Function`, `process` or
      `Buffer` (checked while writing this milestone; sha256
      `16f210b939b359b6ec8dde581eb62c157185711dc7b719b33779c43db5c31a91`).
      A small `hooks/vendor/js-yaml.d.mts` types the one export used, for the
      manual `tsc` check.

      This rests on spec premise **P8** (unverified): a vendored single-file
      parser runs in the mod environment. The tests of this milestone are the
      proof: `sh tests/run.sh` (which runs the mod tests on a staged copy) imports `plan.ts`, which imports the
      vendored file. If `claude plugin test` or `validate` refuses the file
      (for example it uses something the environment lacks), fall back to
      running `milestoned-plan-dag resolve <plan>` with `$.process.run` and
      parsing its fixed output shape in `hooks/plan.ts` — the spec's named
      fallback — and say so in the report. The resolve output (see
      `milestoned-plan-dag/testdata/golden/branching.resolve.yaml`) is yaml.v3
      block YAML at 4-space indent: `schemaVersion:`, `order:` with
      `    - <slug>` items, then `milestones:` with items starting
      `    - number: <n>` whose keys sit at 6 spaces (`slug:`, `goal:`,
      `deliverables:`, `contract:`, `steps:`, ... and last `depends_on:`,
      either `depends_on: []` or followed by `        - <slug>` lines); keys
      nested deeper than 6 spaces are to be skipped. On the fallback,
      `parsePlanYaml` keeps its signature but parses that shape (resolve
      already derived every slug), the parse-error criterion uses text that
      lacks `milestones:`, and `hooks/vendor/` is not created.
