    description: |
      Spec requirements 9, 11, 12, 13 (and the marks M1 added, requirement 14).
      Builds on M1's `Status` set and `runClock`.

      **What M1 leaves you.** When this milestone starts, M1 has merged:
      - `types/index.d.ts`: `Status` is the eleven statuses
        `'waiting' | 'ready' | 'implementing' | 'implemented' | 'verifying' | 'verified' | 'failed' | 'fixing' | 'passed' | 'merged' | 'stuck'`,
        and `export type RunClock = { phase: 'running' | 'idle' | 'done'; elapsedMs: number }`.
      - `hooks/tracker.ts`: `export function runClock(state: RunState, now: number): RunClock`
        (running while any agent has `endedAt === null`; otherwise `done`
        when every plan milestone is merged, else `idle`; elapsed stops at
        the last agent's end once nothing runs).
      - `hooks/layout.ts`: `STATUS_MARK` has all eleven keys (implemented
        and verified `◌`, failed `✗`, stuck `⊘`, passed `◑`, merged `✓`,
        implementing `●`, verifying `◐`, fixing `↻`, ready `○`, waiting `·`);
        the private `STATUS_ORDER` lists all eleven. `RUNNING` is still
        `['implementing', 'verifying', 'fixing']`.
      - `hooks/test/layout.test.ts`: the `counts` record in the test
        `formatDuration cut headerLine bandLine` has all eleven keys.
      If any of these is missing, stop and report: M1 is not merged.

      **Status line** (`boxLine` case `'status'` in `hooks/layout.ts`): the
      hand-off statuses carry what they wait for —
      `implemented · awaiting verify`, `verified · awaiting verdict`,
      `passed · awaiting merge`, `failed · awaiting fix`. Other statuses keep
      `${mark} ${status}`. The `(attempt N)` suffix stays. Put the labels in an
      exported `STATUS_LABEL: Record<Status, string>` so tests and the README
      read one source. The row is still `framed(...)`, so at a narrow box
      the label is cut with `…` and the row keeps the box width.

      **Header.** `headerLine(title, counts, clock: RunClock, w)` replaces the
      `elapsedMs` argument with M1's `RunClock`. It ends with
      `formatDuration(clock.elapsedMs)` while running, with
      `${formatDuration(elapsedMs)} · idle` when idle, and
      `${formatDuration(elapsedMs)} · done` when done. The title is still cut
      first (the existing `titleRoom` arithmetic is kept; only the time part
      grows).

      **Band.** `bandLine(milestones, views, w)` lists the merged count, then
      every milestone whose status is running (`implementing`, `verifying`,
      `fixing`) or a hand-off (`implemented`, `verified`, `passed`, `failed`),
      as `M<n> <status>`, and ends with `· idle` when none is running, e.g.
      `rpir: 1 merged · M2 verifying · M3 implemented` and
      `rpir: 1 merged · M2 implemented · idle`. Stuck and not-started
      milestones are left out (spec requirement 12). The band names the bare
      status (not the `· awaiting …` label) to stay short. The whole line is
      still cut to `w` with `cut`, so at a very narrow width `· idle` can be
      cut off like any other tail; that is accepted.

      **Colours** (`styleOf` in `hooks/register.tsx`, exported so a test can
      call it): implementing, verifying, fixing, implemented, verified →
      `{ color: '#5FAFFF' }`; passed, merged → `{ color: 'success' }`;
      waiting → `{ dimColor: true }`; ready → `{}`; failed →
      `{ color: 'warning' }`; stuck → `{ color: 'error' }`; `null` → `{}`.
      The ticker logic in `register.tsx` (redraw each second only while an
      agent runs) stays; the pane `ui.render` hook passes `runClock(run, now)`
      to `headerLine`. Nothing else in `register.tsx` changes; in particular
      the band render hook is untouched (it already calls `bandLine`).

