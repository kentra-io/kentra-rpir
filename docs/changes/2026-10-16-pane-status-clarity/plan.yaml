            const s = apply(withPlan(planOf([[1, 'a', []]])), [
              spawn('i1', implPrompt(1, 'a'), 1000),
              done('i1', 'STATUS: DONE', 4000),
              spawn('v1', verifyPrompt(1, 'a'), 5000),
              done('v1', 'I ran the check; it looked fine.', 8000), // no VERDICT line
