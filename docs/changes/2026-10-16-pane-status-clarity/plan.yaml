# yaml-language-server: $schema=https://raw.githubusercontent.com/kentra-io/milestoned-plan-dag/v0.3.0/schema/plan.schema.json
schemaVersion: 0.3.0
description: |
  Second iteration of the kentra-rpir **mod** (the milestone graph pane, first
  built by change `docs/changes/2026-10-16-milestone-graph-pane`). It makes
  every box say whether its milestone's subagent is **running** or which
  orchestrator step it **waits for**, makes the header and band say when
  nothing runs, recolours the statuses, and adds a committed demo that runs
  the real `/kentra-rpir:implement` on a tiny throwaway plan.

  **What a mod is.** A Claude Code plugin whose `hooks/hooks.json` names a
  hooks module (`hooks/register.tsx`). The module exports
  `register: Register = (on, options) => { ... }` (types from `'claude-code'`).
  Every hook is `($, e, next)`. The module runs with no Node and no DOM; JSX
  compiles against the global `h`; elements come from
  `const { Box, Text, Button } = $.ui.resolve(e)`. For API shapes load the
  `plugin-authoring` skill and grep the types file it names; do not guess.

  **The mod's files.**
  - `types/index.d.ts` — shared types (`Status`, `AgentRun`, `RunState`,
    `MilestoneView`, `Row`, …) and the `$.state` contract;
  - `hooks/tracker.ts` — pure: `reduce(state, event)`, `viewOf(state, slug, now)`
    (a `MilestoneView` whose `status` comes from the private `statusOf`),
    `countByStatus(state, now)`;
  - `hooks/layout.ts` — pure: `STATUS_MARK`, `layoutGraph`, `headerLine`,
    `bandLine`, `formatDuration`, `cut`;
  - `hooks/nav.ts` — pure helpers the wiring uses (`milestonesOf`, `viewsOf`, …);
  - `hooks/register.tsx` — wiring only: events → tracker, state → layout →
    tree; `styleOf(status)` picks each row's colour;
  - `hooks/test/*.test.ts(x)` — tests run by `claude plugin test`, importing
    `test`, `expect`, `mock` from `'claude-code/testing'`.

  **How an agent's time works today.** An `AgentRun` has `startedAt` and
  `endedAt` (null while it runs). A box's `impl`/`verify` times sum
  `(endedAt ?? now) - startedAt` over the milestone's agents, so a finished
  agent's time already stops. The defect this change fixes is the *status*:
  a finished implementer still reads `implementing`, a verifier with no
  verdict read still reads `verifying`, and a verifier FAIL reads `stuck`.

  **Standard check.** `sh tests/run.sh` from the repo root: the script
  tests, the workflow checks, and (when `claude` is on PATH)
  `claude plugin validate .` plus `claude plugin test` on a staged copy of
  `.claude-plugin/plugin.json`, `hooks/` and `types/`. Every milestone keeps
  it green.

  **Versioning.** Every change to the plugin bumps `version` in
  `.claude-plugin/plugin.json`; M1 sets `0.5.1` and later milestones leave it.
milestones:
  - number: 1
    slug: statuses
    goal: "The tracker tells a running milestone from one waiting on the orchestrator"
    description: |
      Spec requirements 1–8 and 10, plus the run-level clock that requirement 11
      needs. The status set grows by three hand-off statuses, `implemented`,
      `verified` and `failed`, and `stuck` narrows to an implementer's
      `BLOCKED`/`NEEDS_CONTEXT`. The rules in `statusOf`
      (`hooks/tracker.ts`), in order of precedence:

      1. merged (`mergedAt !== null`) → `merged`;
      2. a running agent (`endedAt === null`, newest first): verifier →
         `verifying`; implementer → `fixing` if an earlier verifier of the
         milestone said FAIL, else `implementing`;
      3. otherwise the newest agent decides: implementer with `DONE`,
         `DONE_WITH_CONCERNS` or no outcome → `implemented`; implementer with
         `BLOCKED`/`NEEDS_CONTEXT` → `stuck`; verifier `PASS` → `passed`;
         verifier `FAIL` → `failed`; verifier with no outcome → `verified`;
      4. no agent → `ready` when every dependency is merged, else `waiting`.

      Only two branches of today's `statusOf` change (step 3 above): the
      verifier `FAIL` branch returns `failed` instead of `stuck`, the
      verifier-without-verdict branch returns `verified` instead of
      `verifying`, and the implementer fall-through returns `implemented`
      instead of `implementing`. Rules 1, 2 and 4 are today's code, unchanged.
      An implementer whose turn ended (`agentDone` with `resultText: null`)
      and that has not been reopened by a `tool`/`resume` event has
      `endedAt !== null` and `outcome === null`, so it reads `implemented`
      until it wakes again — the same thing the pane cannot tell apart from
      a finished agent; this is the accepted limit from the first change.

      The times need no change (an ended agent's span already stops at
      `endedAt`); a test pins it for the hand-off statuses (requirement 10).

      **Run clock.** New pure export in `hooks/tracker.ts`:
      `runClock(state: RunState, now: number): RunClock`, with the new type in
      `types/index.d.ts`:
      `export type RunClock = { phase: 'running' | 'idle' | 'done'; elapsedMs: number }`.
      - `running` when any agent has `endedAt === null`; `elapsedMs = now - startedAt`.
      - otherwise `done` when `state.plan` is non-null, has at least one
        milestone, and every plan milestone is merged; else `idle`. In both,
        `elapsedMs = max(endedAt over all agents) - startedAt` (0 when there
        are no agents).
      `startedAt` is `state.startedAt`: the wiring creates the run with
      `emptyRun(at)` at the first milestone dispatch (`hooks/register.tsx`
      line ~158), so it is the first dispatch's time, which is what spec
      requirement 11 measures from. Clamp `elapsedMs` at 0 (`Math.max(0, …)`)
      like `span` does. "Merged" for a plan milestone means
      `state.milestones[slug]?.mergedAt` is non-null; a plan milestone never
      dispatched is not merged. When `state.plan` is null the phase is never
      `done`. M2 draws it in the header and band; this milestone does not
      call it from `register.tsx`.

      **Marks.** `STATUS_MARK` in `hooks/layout.ts` is a
      `Record<Status, string>`, so this milestone adds the three new keys
      there (implemented `◌`, verified `◌`, failed `✗`) and changes stuck to
      `⊘` (requirement 14), and adds the new statuses to `STATUS_ORDER` (header
      count order, furthest along first: merged, passed, failed, verified,
      verifying, fixing, implemented, implementing, stuck, ready, waiting).
      Nothing else in `layout.ts` changes here — M2 owns the labels, header
      and band — but existing layout tests that build a `Record<Status, number>`
      gain the three new keys so they still type-check and pass.
      `RUNNING` in `layout.ts` stays `['implementing', 'verifying', 'fixing']`
      (M2 rewrites `bandLine`).

      **Files outside this milestone that read `Status`.** `styleOf` in
      `hooks/register.tsx` is a `switch` with a `default: return {}` branch,
      so the new statuses compile and draw with no colour until M2 recolours
      them; do not edit `register.tsx` here. No wiring, nav, plan or
      scaffold test asserts a status that changes (checked: the wiring
      tests assert `/1 implementing/` only while the implementer runs, and
      `/✓ merged/` after a merge), so they stay green untouched.

      Bump `.claude-plugin/plugin.json` `version` to `0.5.1`.
    deliverables: |
      - `types/index.d.ts` — `Status` becomes
        `'waiting' | 'ready' | 'implementing' | 'implemented' | 'verifying' | 'verified' | 'failed' | 'fixing' | 'passed' | 'merged' | 'stuck'`;
        new `export type RunClock = { phase: 'running' | 'idle' | 'done'; elapsedMs: number }`.
      - `hooks/tracker.ts` — `STATUSES` lists all eleven; `statusOf` follows the
        rules above; new `export function runClock(state: RunState, now: number): RunClock`.
      - `hooks/layout.ts` — `STATUS_MARK` and `STATUS_ORDER` cover the eleven
        statuses (marks above); no other change.
      - `hooks/test/tracker.test.ts` — updated and new tests (criteria).
      - `hooks/test/layout.test.ts` — only the `counts` record gains the new keys.
      - `.claude-plugin/plugin.json` — `version` `0.5.1`.
