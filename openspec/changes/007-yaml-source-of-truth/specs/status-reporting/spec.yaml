capability: status-reporting
deltas:
  # MODIFIED carries the requirement's ENTIRE intended post-change shape —
  # the fold replaces, it does not merge (spec-lifecycle.md §6.1).
  - op: MODIFIED
    requirement:
      name: 'Machine-readable capability warnings'
      text: |
        The system SHALL include oversized-capability warnings in `lifecycle
        status`'s YAML machine output (`--format yaml`) as a
        `capabilityWarnings` sequence (each entry naming the capability and
        its line count), matching the same data surfaced in `--format text`.
        The `--format json` option is removed.
      scenarios:
        - name: 'YAML status output with an oversized capability'
          given:
            - '`openspec/specs/auth/spec.md` exceeds the configured threshold'
          when:
            - '`lifecycle status --format yaml` runs'
          then:
            - 'the YAML output''s `capabilityWarnings` sequence contains an entry for `auth` with its current line count'
