capability: status-reporting
requirements:
  - name: 'Oversized-capability warning'
    text: |
      The system SHALL surface an advisory warning identifying any capability
      whose `openspec/specs/<capability>/spec.md` exceeds
      `capabilitySizeWarningLines` (default 200) lines, from both
      `lifecycle status` and `lifecycle guard`, without changing either verb's
      exit code.
    scenarios:
      - name: 'A capability''s spec.md exceeds the threshold'
        given:
          - '`openspec/specs/auth/spec.md` is 250 lines long and `capabilitySizeWarningLines` is unset (default 200)'
        when:
          - '`lifecycle status` runs'
        then:
          - 'the report includes a warning naming `auth` and its current line count, and the command still exits `0`'
      - name: 'Every capability is within the threshold'
        given:
          - 'every capability''s `spec.md` is under the configured threshold'
        when:
          - '`lifecycle status` or `lifecycle guard` runs'
        then:
          - 'no `capability_oversized` warning is reported'
  - name: 'Machine-readable capability warnings'
    text: |
      The system SHALL include oversized-capability warnings in
      `--format json` output as a `capabilityWarnings` array (each entry naming
      the capability and its line count), matching the same data surfaced in
      `--format text`.
    scenarios:
      - name: 'JSON status output with an oversized capability'
        given:
          - '`openspec/specs/auth/spec.md` exceeds the configured threshold'
        when:
          - '`lifecycle status --format json` runs'
        then:
          - 'the JSON output''s `capabilityWarnings` array contains an entry for `auth` with its current line count'
