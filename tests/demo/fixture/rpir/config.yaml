# kentra-rpir configuration for the throwaway demo project. Cheap roles.
project: demo
tracker: none
constitution: false
roles:
  lead:        { agent: "kentra-rpir:lead",        model: haiku }
  implementer: { agent: "kentra-rpir:implementer", model: haiku }
  verifier:    { agent: "kentra-rpir:verifier",    model: haiku }
implement:
  worktreesDir: .worktrees
  branchPrefix: rpir/
  openPullRequest: false
